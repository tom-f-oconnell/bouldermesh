# The iPhone app, signed for the App Store and uploaded to TestFlight, from which a tester's iPhone installs it (no Mac,
# no cable). Every push to main that changes the iPhone app's own code or its build (not the Android app's, the docs,
# CI's scripts or this file: so that a build number only rises with the app), or by hand (gh workflow run
# testflight.yml). Each upload's build number is this workflow's run number; once Apple has processed it, it goes to the
# external groups (the public link) and to beta review (app/ci/testflight-group.py --publish). Its seven secrets come
# from app/ci/ios-signing.sh (app/README.md, "TestFlight"): without them it says so and does nothing.
name: TestFlight
on:
  push:
    branches: [main]
    paths: ["app/shared/src/commonMain/**", "app/ios/src/**", "app/ios/xcode/**", "app/ios/build.gradle.kts", "app/shared/build.gradle.kts",
            "app/build.gradle.kts", "app/settings.gradle.kts", "app/gradle.properties", "app/gradle/**"]
  workflow_dispatch:
concurrency: { group: testflight, cancel-in-progress: false }
defaults:
  run:
    shell: bash       # with pipefail: a build piped through tail still fails the step
jobs:
  upload:
    runs-on: macos-26     # Xcode 26: App Store Connect takes only apps built with the iOS 26 SDK or later (Nov 2026)
    env:
      READY: ${{ secrets.ASC_KEY_P8 != '' && secrets.IOS_DIST_P12 != '' && secrets.IOS_APPSTORE_PROFILE != '' && secrets.APPLE_TEAM_ID != '' }}
      BUILD: ${{ github.run_number }}
    steps:
      - name: Without its secrets, nothing to do
        if: env.READY != 'true'
        run: echo "::notice::TestFlight is not set up yet; app/README.md, 'TestFlight', says how (app/ci/ios-signing.sh)"
      - uses: actions/checkout@v5
        if: env.READY == 'true'
      - uses: actions/setup-java@v5
        if: env.READY == 'true'
        with: { distribution: temurin, java-version: "21" }
      - name: The newest Xcode 26 on the runner, whose iOS 26 SDK the upload needs
        if: env.READY == 'true'
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] || { echo "::error::no Xcode 26 on this runner: App Store Connect refuses builds from an older SDK"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version
      - if: env.READY == 'true'
        run: brew install xcodegen
      - name: The signing certificate in a keychain of its own, and the provisioning profile
        if: env.READY == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db" kcpw=$(openssl rand -hex 16)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Apple's intermediate, should the image not have it: codesign needs the whole chain
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            && security import "$RUNNER_TEMP/wwdr.cer" -k "$kc" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -q "Apple Distribution" \
            || { echo "::error::no Apple Distribution identity in IOS_DIST_P12"; exit 1; }
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/appstore.mobileprovision" "$d/$uuid.mobileprovision"
          done
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "signing with $(security find-identity -v -p codesigning "$kc" | grep -m1 'Apple Distribution'), profile '$name'"
      - name: The App Store Connect API key, for the upload
        if: env.READY == 'true'
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys" && printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Archive, signed for the App Store
        if: env.READY == 'true'
        working-directory: app/ios/xcode
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodegen
          xcodebuild -project BoulderMesh.xcodeproj -scheme BoulderMesh -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BoulderMesh.xcarchive" -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CURRENT_PROJECT_VERSION="$BUILD" archive | tail -60
      - name: Upload to TestFlight
        if: env.READY == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>sh.boulderme.app</key><string>$PROFILE_NAME</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/BoulderMesh.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" | tail -40
          echo "::notice::Uploaded build $BUILD (0.1.0). It shows in App Store Connect's TestFlight once Apple has processed it (minutes)."
      - name: To the public link's testers, once Apple has processed it
        if: env.READY == 'true'
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" install -q pyjwt cryptography
          SIGNING_DIR="$RUNNER_TEMP/keys" "$RUNNER_TEMP/asc/bin/python" app/ci/testflight-group.py "$ISSUER" \
            --publish "$BUILD" "$(git log -1 --format=%s)"
      - name: The keychain and key gone
        if: always() && env.READY == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/appstore.mobileprovision"
