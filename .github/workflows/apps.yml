# The phone apps (app/), as far as they can be checked with no phone: the shared logic's tests on the JVM and natively
# as an iPhone runs them; both apps built; and each run against a test server with one made-up mesh, the iPhone app in a
# simulator and the Android app in an emulator, with a picture kept of every screen (the run's artifacts).
name: Phone apps
on:
  push:
    paths: ["app/**", ".github/workflows/apps.yml", "tests/capture_fixture.py"]
  workflow_dispatch:
permissions:
  contents: write       # the android-latest release
defaults:
  run:
    shell: bash       # with pipefail: a build piped through tail still fails the step
env:
  PORT: "47613"
  ADMIN_PORT: "47614"
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - run: brew install xcodegen
      - name: The shared logic's tests, on the simulator's processor too
        working-directory: app
        run: ./gradlew --no-daemon :shared:jvmTest :shared:iosSimulatorArm64Test
      - name: Build the app
        working-directory: app/ios/xcode
        run: |
          xcodegen
          xcodebuild -project BoulderMesh.xcodeproj -scheme BoulderMesh -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: A test server with one mesh
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q numpy pillow
          "$RUNNER_TEMP/venv/bin/python" tests/capture_fixture.py "$RUNNER_TEMP/data"
          DATA_DIR="$RUNNER_TEMP/data" HOST=127.0.0.1 nohup "$RUNNER_TEMP/venv/bin/python" backend/server.py > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 30); do curl -sf "http://127.0.0.1:$PORT/api/capture/meshes" && break; sleep 1; done
          echo "SAMPLE=$RUNNER_TEMP/captures/$("$RUNNER_TEMP/venv/bin/python" app/ci/sample_capture.py "http://127.0.0.1:$PORT" "$RUNNER_TEMP/captures")" >> "$GITHUB_ENV"
      - name: Every screen, in a simulator
        run: app/ci/screens-ios.sh "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/BoulderMesh.app" "http://127.0.0.1:$PORT" screens
      - if: always()
        run: mkdir -p screens && cp "$RUNNER_TEMP/server.log" screens/ios-server.log || true
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: ios-screens, path: screens }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: Build the app, signed with the apps' one key (the repo's secrets; the SDK's debug key where they're not given)
        working-directory: app
        env:
          SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          BM_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          BM_VERSION_CODE: ${{ github.run_number }}      # rising: what the app's Update goes by (Update.kt)
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            printf %s "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing.p12"
            export BM_SIGNING_KEYSTORE="$RUNNER_TEMP/signing.p12"
          fi
          BM_COMMIT=${GITHUB_SHA::7} ./gradlew --no-daemon :shared:jvmTest :android:assembleDebug
          rm -f "$RUNNER_TEMP/signing.p12"
      - name: Keep the APK
        uses: actions/upload-artifact@v7
        with: { name: "android-debug-${{ github.sha }}", path: app/android/build/outputs/apk/debug/android-debug.apk, retention-days: 30 }
      # a new release only when the Android app's own code or build changed since the last one: phones are offered each
      # release as an update, so a push of docs, tests, CI's scripts or the iPhone app's code alone doesn't make one
      - name: Whether the Android app changed since the release "android-latest"
        id: changed
        if: github.ref == 'refs/heads/main'
        run: |
          paths="app/shared/src/commonMain app/android/src app/android/build.gradle.kts app/shared/build.gradle.kts app/build.gradle.kts app/settings.gradle.kts app/gradle.properties app/gradle"
          if git fetch -q --depth=1 origin tag android-latest 2>/dev/null && git diff --quiet android-latest HEAD -- $paths; then
            echo "::notice::The Android app hasn't changed since the release android-latest ($(git rev-parse --short android-latest)): no new release"
            echo "release=no" >> "$GITHUB_OUTPUT"
          else
            echo "release=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: The APK as the release "android-latest", which a phone downloads with no sign-in (main only)
        if: github.ref == 'refs/heads/main' && steps.changed.outputs.release == 'yes'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          short=${GITHUB_SHA::7}
          cp app/android/build/outputs/apk/debug/android-debug.apk "bouldermesh-$short-debug.apk"
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          cp "bouldermesh-$short-debug.apk" bouldermesh.apk     # the same, under a name that stays: the volunteer page's link
          # what the app reads to tell a newer build (Update.kt): a download, which GitHub doesn't rate-limit as it does its API
          printf '{"build": %s, "commit": "%s", "bytes": %s}\n' "$GITHUB_RUN_NUMBER" "$short" "$(stat -c %s bouldermesh.apk)" > latest.json
          gh release create android-latest "bouldermesh-$short-debug.apk" bouldermesh.apk latest.json --target "$GITHUB_SHA" --prerelease \
            --title "Android app, latest ($short, build $GITHUB_RUN_NUMBER)" \
            --notes "The Android app as built from $short: open this page on the phone, tap the .apk, and allow installing it. Each build is signed with the same key, so it installs over the last, keeping captures not yet sent; the app offers each newer one itself."
      - name: A test server with one mesh
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q numpy pillow
          "$RUNNER_TEMP/venv/bin/python" tests/capture_fixture.py "$RUNNER_TEMP/data"
          DATA_DIR="$RUNNER_TEMP/data" nohup "$RUNNER_TEMP/venv/bin/python" backend/server.py > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 30); do curl -sf "http://127.0.0.1:$PORT/api/capture/meshes" && break; sleep 1; done
          echo "SAMPLE=$RUNNER_TEMP/captures/$("$RUNNER_TEMP/venv/bin/python" app/ci/sample_capture.py "http://127.0.0.1:$PORT" "$RUNNER_TEMP/captures")" >> "$GITHUB_ENV"
      - name: A second test server, with accounts, and a code an account made to sign the app in with
        run: |
          DATA_DIR="$RUNNER_TEMP/data-accounts" PORT=47615 ADMIN_PORT=47616 EDIT_TOKEN=ci-editing-token \
            nohup "$RUNNER_TEMP/venv/bin/python" backend/server.py > "$RUNNER_TEMP/server-accounts.log" 2>&1 &
          for i in $(seq 30); do curl -sf "http://127.0.0.1:47615/api/status" > /dev/null && break; sleep 1; done
          code=$("$RUNNER_TEMP/venv/bin/python" app/ci/pair_code.py http://127.0.0.1:47615 http://127.0.0.1:47616 "Pat Tester")
          echo "PAIR_CODE=$code" >> "$GITHUB_ENV"
          echo "PAIR_SERVER=http://10.0.2.2:47615" >> "$GITHUB_ENV"
          echo "PAIR_NAME=Pat Tester" >> "$GITHUB_ENV"
      - name: Let the emulator use this machine's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Google Play Services for AR, as made for emulators
        run: curl -sfL -o "$RUNNER_TEMP/arcore.apk" https://github.com/google-ar/arcore-android-sdk/releases/download/1.57.0/Google_Play_Services_for_AR_1.57.0_x86_for_emulator.apk
      - name: Every screen, in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30      # ARCore opens camera "0", which newer emulators' cameras aren't called
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: |
            adb install -r "$RUNNER_TEMP/arcore.apk" || echo "::warning::Google Play Services for AR didn't install: the capture screen will say it can't track"
            app/ci/screens-android.sh app/android/build/outputs/apk/debug/android-debug.apk "http://10.0.2.2:$PORT" screens
      # ARCore runs in an emulator only through its camera that shows a made-up room, and on Android 11 (later ones don't
      # call that camera "0", which is what ARCore asks for). There it starts and the app draws the camera's picture, which
      # is what this checks. It never begins tracking: GitHub's machines draw everything in software and give it about two
      # frames a second, where it needs them under 400 ms apart, at any picture size. Moving the room's camera can be done
      # (adb emu automation play $ANDROID_HOME/emulator/resources/macros/Track_horizontal_plane), for a faster machine.
      - name: The emulator's camera as a room to look at
        run: |
          f="$HOME/.android/avd/test.avd/config.ini"
          sed -i '/^hw.camera.back/d' "$f" && echo "hw.camera.back=virtualscene" >> "$f"
      - name: The capture screen again, with that camera
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30      # ARCore opens camera "0", which newer emulators' cameras aren't called
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene
          disable-animations: true
          script: |
            adb install -r "$RUNNER_TEMP/arcore.apk" || true
            ONLY=capture PREFIX=android-room app/ci/screens-android.sh app/android/build/outputs/apk/debug/android-debug.apk "http://10.0.2.2:$PORT" screens
      - if: always()
        run: mkdir -p screens && cp "$RUNNER_TEMP/server.log" screens/android-server.log && cp "$RUNNER_TEMP/server-accounts.log" screens/android-server-accounts.log || true
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: android-screens, path: screens }
