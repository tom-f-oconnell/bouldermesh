# Builds the iPhone app (app/ios) for the simulator on GitHub's Macs: the only check of its linking, its Swift and its
# Xcode project that can be had without a Mac. Also runs the shared logic's tests natively, as an iPhone would.
name: iOS app
on:
  push:
    paths: ["app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: brew install xcodegen
      - name: The shared logic's tests, on the simulator's processor too
        working-directory: app
        run: ./gradlew --no-daemon :shared:jvmTest :shared:iosSimulatorArm64Test
      - name: Build the app
        working-directory: app/ios/xcode
        run: |
          xcodegen
          xcodebuild -project BoulderMesh.xcodeproj -scheme BoulderMesh -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
