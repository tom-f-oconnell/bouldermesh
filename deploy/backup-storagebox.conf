# Runs the backup (bouldermesh-backup.service and bouldermesh-restore.service) on the public server itself, into the
# Storage Box bouldermesh-storagebox.service mounts, rather than on another machine pulling over SSH (README, "Backups").
# A drop-in for both services; on the server:
#     for u in backup restore; do sudo mkdir -p /etc/systemd/system/bouldermesh-$u.service.d
#         sudo cp deploy/backup-storagebox.conf /etc/systemd/system/bouldermesh-$u.service.d/storagebox.conf; done
#     sudo cp deploy/bouldermesh-backup.service deploy/bouldermesh-backup.timer deploy/bouldermesh-restore.service \
#         deploy/bouldermesh-restore.timer /etc/systemd/system/
#     sudo systemctl daemon-reload && sudo systemctl enable --now bouldermesh-backup.timer bouldermesh-restore.timer
[Unit]
Wants=bouldermesh-storagebox.service
After=bouldermesh-storagebox.service

[Service]
Environment=SCRIPT=/home/tom/bouldermesh/deploy/backup.sh SOURCE=/home/tom/bouldermesh
Environment=BACKUP_DIR=/home/tom/storagebox/bouldermesh-backups BACKUP_MOUNT=/home/tom/storagebox
Environment="BACKUP_HANDSHAKE=python3 /home/tom/bouldermesh/deploy/backup-handshake.py" "BACKUP_HOST=the Storage Box"
