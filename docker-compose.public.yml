# The public setup, over docker-compose.yml:
#     docker compose -f docker-compose.yml -f docker-compose.public.yml up -d
# The image is built elsewhere (compiling COLMAP wants cores and memory a small server hasn't got) and loaded from a
# docker save, or pulled from a registry named in BM_IMAGE; nothing is built here.
# Caddy takes the site's traffic on ports 80 and 443, with a Let's Encrypt certificate for SITE_HOST, and the app's own
# ports are reachable only from this machine (the admin page over an SSH tunnel). Nothing can be changed from a browser
# unless .env sets EDIT_TOKEN, and then only with it. The container runs as uid 1000, not root, so ./data must be writable
# by that user. See the README, "Putting it on the public internet".
services:
  bouldermesh:
    build: !reset null
    image: "${BM_IMAGE:-bouldermesh-bouldermesh:latest}"
    ports: !override
      - "127.0.0.1:${PORT:-8470}:8470"
      - "127.0.0.1:${ADMIN_PORT:-36184}:36184"
    environment:
      READ_ONLY: "${READ_ONLY:-auto}"       # view-only unless EDIT_TOKEN is set in .env
      CLIENT_IP_HEADER: X-Real-IP           # Caddy names the sender there, for the log
      CADDYFILE: /app/deploy/Caddyfile      # the admin page says when Cloudflare's addresses no longer match its trusted_proxies
      VOLUNTEER_URL: "https://${SITE_HOST}" # where volunteers reach it (Caddy passes /volunteer/ on), for the admin page's command
      SITE_URL: "https://${SITE_HOST}"      # the link in the admin page's QR that gives a phone the editing token
      VIDEO_CACHE_GB: "${VIDEO_CACHE_GB:-10}"
      CAMPAIGN_MIN_FREE_GB: "${CAMPAIGN_MIN_FREE_GB:-10}"   # areas stop with less disk left than this (50 elsewhere)
      DATA_CAP_GB: "${DATA_CAP_GB:-60}"     # over this much data, volunteers and areas wait for room (none elsewhere); the admin page changes it
      SITE_SOURCES: "${SITE_SOURCES:-link}"  # photos and frames not clearly free to copy are linked to, not served (all | link | permitted)
      SITE_TEXTURES:                        # from .env, optional: all (the default) | permitted | none. The admin page can change
                                            # both, and its choices last across deploy/ship.sh
    volumes:
      - ./deploy:/app/deploy:ro             # a folder, not the file, so that a git pull is seen without recreating the container
    user: "${BM_USER:-1000:1000}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 4096
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_HOST: "${SITE_HOST:?set SITE_HOST in .env to the site's domain name}"
      WWW_HOST:                             # from .env, optional: a second name (www.…) pointed here, which redirects to SITE_HOST
      MAX_BODY:                             # from .env, optional: the largest request Caddy passes on (default 1100MB, for uploads with the token)
      VOLUNTEER_UPSTREAM:                   # from .env, optional: where /volunteer/ goes: this machine's app (the default), or
                                            # unix//run/bm-tunnel/volunteer.sock for another's, through deploy/volunteer-tunnel.service
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/tunnel:/run/bm-tunnel        # the SSH tunnel's socket, when volunteers are another machine's
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [bouldermesh]
volumes:
  caddy_data:
  caddy_config:
