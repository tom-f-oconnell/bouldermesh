# The Xcode project, made from this by XcodeGen (brew install xcodegen; then `xcodegen` here), so that none is kept in git.
name: BoulderMesh
options:
  bundleIdPrefix: sh.boulderme
  deploymentTarget:
    iOS: "16.0"       # full-size photos while tracking (ARSession.captureHighResolutionFrame) came with iOS 16
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"     # the script below runs Gradle, which writes outside what Xcode would let it
targets:
  BoulderMesh:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]      # the icon: app/make_icons.py, from the site's favicon
    scheme: {}        # a scheme kept with the project, so that xcodebuild finds one on a machine Xcode has never opened it on
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: BoulderMesh
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"      # each TestFlight upload's its own (the workflow's run number)
        ITSAppUsesNonExemptEncryption: false     # only HTTPS: exempt, so App Store Connect doesn't ask with each build
        UILaunchScreen: {}
        CFBundleURLTypes:      # the site's "Sign the app in": bouldermesh://pair?code=…&server=… (Main.kt, openLink())
          - CFBundleURLName: sh.boulderme.app.pair
            CFBundleURLSchemes: [bouldermesh]
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "To photograph the rock, and to track where the phone is as it does."
        NSLocationWhenInUseUsageDescription: "So that each photo says where it was taken and which way it faced, which puts the mesh on the map."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true      # plain http to a test server on the local network; anywhere else, https alone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.boulderme.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # the Kotlin framework is a static one: what it uses of iOS is linked here
        OTHER_LDFLAGS: "$(inherited) -framework BoulderMeshKit -framework ARKit -framework SceneKit -framework CoreMotion -framework CoreLocation -framework AVFoundation -framework ImageIO -framework CoreImage -framework CoreVideo -framework CoreMedia -framework AudioToolbox"
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home 2>/dev/null)}"     # Xcode doesn't run this with your shell's settings
          ./gradlew :ios:embedAndSignAppleFrameworkForXcode
