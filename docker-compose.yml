services:
  bouldermesh:
    build: .
    ports:
      - "${PORT:-8470}:8470"
      # the admin page: only on this host's loopback, or a LAN address (ADMIN_BIND), never on every address
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-36184}:36184"
      # volunteers fetching YouTube videos: only on this host's loopback, for an SSH tunnel from the public server's
      # Caddy (deploy/volunteer-tunnel.service, README "Volunteers")
      - "127.0.0.1:${VOLUNTEER_PORT:-47613}:47613"
    volumes: ["./data:/data"]
    environment:
      # USE_GPU: "0"              # keeps photo matching on the CPU; docker-compose.gpu.yml is what gives it a GPU
      MAX_UPLOAD_MB: "1024"
      ADMIN_PORT: "36184"
      TZ:                         # from .env, optional: the time zone of the times it shows (as America/Los_Angeles; UTC), which it keeps in UTC anyway
      BOULDERMESH_SECRETS_KEY:    # from .env: encrypts credentials saved on the admin page (see backend/settings.py)
      ADMIN_PASSWORD:             # from .env, optional: a password for the admin page (user "admin")
      ADMIN_HOSTNAMES:            # from .env, optional: names the admin page is reached by besides addresses and LAN names
      ADMIN_BIND:                 # the address above, so that the server can refuse to publish the admin page on a public one
      ADMIN_PUBLISHED_PORT: "${ADMIN_PORT:-36184}"   # and its port: the main page's Admin button opens it there
      ADMIN_SSH:                  # from .env, optional: who@where to SSH to, for the Admin button's port-forwarding steps
      VOLUNTEER_PORT: "47613"
      WORKER_PORT: "47614"        # machines that connect here for work: not published, but Caddy reaches it in the public setup
      VOLUNTEER_URL:              # from .env, optional: the address volunteers reach this at, as https://boulders.example.com
      SITE_URL:                   # from .env, optional: the address phones reach this at, for the admin page's editing-token QR
      YOUTUBE_VIA:                # from .env, optional: here | volunteers_when_refused (the default) | volunteers
      VIDEO_CACHE_GB:             # from .env, optional: room for fetched videos, kept for beta and harvesting again (50)
      DATA_CAP_GB:                # from .env, optional: over this much in ./data, volunteers and areas wait for room (no cap); the admin page changes it
      EDIT_TOKEN:                 # from .env, optional: then every change needs "Authorization: Bearer <token>" (README: Putting it on the public internet)
      READ_ONLY:                  # from .env, optional: "1" refuses every change over HTTP; "auto" does unless EDIT_TOKEN is set
      CSP:                        # from .env, optional: "0" turns the page's Content-Security-Policy off, or a policy to use instead
      AWS_ACCESS_KEY_ID:          # from .env, optional: compute credentials, instead of saving them on the admin page
      AWS_SECRET_ACCESS_KEY:
      BOULDERMESH_UA:             # from your shell: identify yourself to the sites you fetch from (Wikimedia rejects placeholder addresses)
      HTTP_MIN_INTERVAL: "3"      # min. seconds between requests to one host (robots.txt Crawl-delay wins if longer)
      # GOOGLE_CSE_KEY: ""        # Google Programmable Search (image mode) - 100 free queries/day
      # GOOGLE_CSE_CX: ""
      # FLICKR_KEY: ""            # Flickr API key for geotagged photo search
      # HARVEST_DDG: "0"          # turns off the unofficial DuckDuckGo image search
      # OPENBETA_MEDIA_BASE: "https://media.openbeta.io"
    restart: unless-stopped
    # on a stop or restart, the server waits up to 10 min for jobs started outside areas to
    # finish, as a restart interrupts them; this is how long Docker lets it before killing it
    stop_grace_period: 11m
